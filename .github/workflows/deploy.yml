name: Deploy Majik Maker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Check desktop, phone, and offline use
        run: |
          npm install --prefix "$RUNNER_TEMP/majikmaker-browser" --no-save --package-lock=false playwright@1.56.1
          node "$RUNNER_TEMP/majikmaker-browser/node_modules/playwright/cli.js" install chromium
          NODE_PATH="$RUNNER_TEMP/majikmaker-browser/node_modules" node scripts/browser-smoke.cjs
      - name: Save browser previews
        uses: actions/upload-artifact@v4
        with:
          name: app-previews
          path: artifacts/*.png
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
